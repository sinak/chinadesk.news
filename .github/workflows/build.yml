name: Build and deploy

# No `schedule:` here on purpose. GitHub runs cron workflows best-effort, and for
# this repo that meant 48% of four-hourly slots never ran and the rest started a
# median 1h46m late. The four-hourly trigger lives in a Cloudflare Worker
# (cron/worker.js) that calls workflow_dispatch on time. Re-adding a schedule
# here would double-fire builds whenever GitHub did get round to it.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# A build takes ~3 minutes and fires every four hours, so overlap is unlikely —
# but a hung model call could run to the 1800s timeout, and two builds writing
# the archive at once would race. Queue instead of cancelling: a cancelled run
# publishes nothing, which is the one outcome worse than a late one.
concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # build.py exits non-zero if any blocking preflight check fails, which
      # stops the job here and leaves the previous Cloudflare deployment live.
      # A stale page beats a wrong one. Never add --skip-checks.
      - name: Build site
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The brief runs once a UTC day; the other five builds read back the
          # published copy. Override either to retune without a code change.
          BRIEF_MODEL: anthropic/claude-sonnet-5.5
          BRIEF_EFFORT: xhigh
        run: python -m src.build --out dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name chinadesk
          --branch main
          --commit-dirty=true
