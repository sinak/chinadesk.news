    label: Lead
    max: 5
  - key: ai
    label: AI
    max: 14
  - key: policy
    label: Policy
    max: 10
  - key: culture
    label: Culture
    max: 10
  - key: analysis
    label: Analysis
    max: 8
  - key: signal
    label: Signal
